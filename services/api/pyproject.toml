[project]
name = "sss-did-api"
version = "0.1.0"
description = "Backend for the SSS / DID account recovery prototype (IF4035 Blockchain)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "web3>=8.0.0",
  "psycopg[binary,pool]>=3.2.3",
  "pydantic>=2.10.4",
  "cryptography>=44.0.0",
  "eth-account>=0.13.4",
]

[dependency-groups]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.25.0", "httpx>=0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
