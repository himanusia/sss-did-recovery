# nginx in front of the API. Only the Cloudflare Tunnel reaches this server
# (published on 127.0.0.1), so the client address comes from CF-Connecting-IP.

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=relay:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    server_tokens off;
    client_max_body_size 256k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    keepalive_timeout 20s;
    send_timeout 20s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    limit_conn conn 32;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Relayed transactions spend the relayer's gas: strict per-IP budget.
    location = /api/identity/register {
        limit_req zone=relay burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8788;
    }

    location ~ ^/api/recovery/(initiate|execute|cancel)$ {
        limit_req zone=relay burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8788;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8788;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
